aid: iqm-quantum-computers
name: IQM Quantum Computers
description: >-
  IQM Quantum Computers (IQM Finland Oy) builds superconducting quantum computers and sells
  access to them, both as on-premises systems and as a cloud service. Its developer surface
  is IQM Resonance, a quantum cloud platform at resonance.iqm.tech whose REST API accepts
  circuits, queues them against a named QPU, and returns measurement results — billed in QPU
  seconds rather than API calls. Access is through a bearer API token generated from the
  Resonance dashboard, and the practical client contract is IQM's Apache-2.0 Python stack
  (iqm-client, with Qiskit, Cirq and Qrisp adapters) rather than a published OpenAPI, which
  IQM does not ship. IQM does publish 14 first-party Protobuf message contracts defining the
  Station Control wire format, a dated changelog with explicit breaking-change notices, and
  a free Starter tier with a monthly credit allowance.
