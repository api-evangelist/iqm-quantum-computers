apis:
- aid: iqm-quantum-computers-resonance
  name: IQM Resonance API
  description: >-
    The REST API behind IQM Resonance, IQM's quantum cloud service. It lists the quantum
    computers available on a server, reports their health and calibration state, accepts
    circuit and sweep jobs for execution, and returns measurements, measurement counts and
    sweep results. Requests are made to https://resonance.iqm.tech/api/v1/ with an IQM API
    token in the Authorization header; job execution is asynchronous and discovered by
    polling. No OpenAPI is published — the operation surface recorded in this repo is
    derived from IQM's own Apache-2.0 iqm-client library.
  humanURL: https://iqm.tech/products/iqm-resonance/
  baseURL: https://resonance.iqm.tech/api/v1/
