note: >-
  HONEST ZERO. IQM publishes no numeric rate limit anywhere public — not in the Resonance
  product page, not in the docs at docs.iqm.tech, and not in the Apache-2.0 iqm-client
  source. What can be established is that limiting EXISTS: the first-party error taxonomy in
  iqm-station-control-client maps HTTP 429 to a dedicated RateLimitError class, so the server
  does throttle. It just never says at what threshold, over what window, or with what
  Retry-After contract. An agent cannot plan against this; it can only react to a 429.
  Separately, the real scarcity control on this API is not requests-per-second at all — it is
  the credit quota and the job queue, which are recorded in plans/.
