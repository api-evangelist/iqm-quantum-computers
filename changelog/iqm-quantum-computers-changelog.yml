note: >-
  IQM publishes no product-level changelog for the Resonance service itself. What it does
  publish, and publishes well, is a dated Keep-a-Changelog-style file for the client library
  that fronts the API — with an explicit "Breaking changes" section per release. Because the
  client is the only public contract, this file IS the API changelog in practice, and it is
  where server-side URL and model changes surface. Recent window only.
